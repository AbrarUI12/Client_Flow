name: clientflow

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clientflow
      POSTGRES_USER: clientflow
      POSTGRES_PASSWORD: clientflow
    ports:
      - "5432:5432"
    volumes:
      - clientflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientflow -d clientflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  clientflow_postgres_data:


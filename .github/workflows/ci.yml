name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clientflow_test
          POSTGRES_USER: clientflow
          POSTGRES_PASSWORD: clientflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clientflow -d clientflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://clientflow:clientflow@localhost:5432/clientflow_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Lint backend
        working-directory: backend
        run: python -m ruff check .
      - name: Test backend on PostgreSQL
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend / production build
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://clientflow-api-abrarui12.onrender.com/api/v1
      VITE_DEMO_EMAIL: demo@clientflow.app
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Type-check and build frontend
        working-directory: frontend
        run: npm run build
